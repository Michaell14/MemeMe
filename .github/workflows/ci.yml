name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build MemeMe.app
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh

      - name: Upload MemeMe.zip
        uses: actions/upload-artifact@v4
        with:
          name: MemeMe-app
          path: build/MemeMe.zip
          if-no-files-found: error
