name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Run by hand to also refresh the website's download (site/MemeMe.zip).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build MemeMe.app
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh

      - name: Upload MemeMe.zip
        uses: actions/upload-artifact@v4
        with:
          name: MemeMe-app
          path: build/MemeMe.zip
          if-no-files-found: error

  publish-download:
    name: Publish site download
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch MemeMe.zip
        uses: actions/download-artifact@v4
        with:
          name: MemeMe-app
          path: site

      - name: Commit site/MemeMe.zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/MemeMe.zip
          if git diff --cached --quiet; then
            echo "site/MemeMe.zip is unchanged"
            exit 0
          fi
          git commit -m "Update site download from ${GITHUB_SHA::7}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
