<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tileGrad" x1="0" y1="96" x2="0" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFA468"/>
      <stop offset="0.5" stop-color="#FF9A5C"/>
      <stop offset="1" stop-color="#EE6530"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="512" cy="300" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0" y1="220" x2="0" y2="784" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="0.55" stop-color="#FFD95A"/>
      <stop offset="1" stop-color="#F5C451"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="184" x2="0" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F0FA"/>
    </linearGradient>
    <linearGradient id="flapGrad" x1="697.26" y1="687.26" x2="657.66" y2="647.66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CFC8E6"/>
      <stop offset="0.25" stop-color="#F4F2FB"/>
      <stop offset="0.6" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E5F5"/>
    </linearGradient>
    <radialGradient id="faceRim" cx="482" cy="452" r="312" gradientUnits="userSpaceOnUse">
      <stop offset="0.72" stop-color="#E8A85C" stop-opacity="0"/>
      <stop offset="1" stop-color="#E8A85C" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="edgeGrad" x1="0" y1="96" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="keep"><path d="M-151.27,1535.79 L1545.79,-161.27 L131.58,-1575.48 L-1565.48,121.58 Z"/></clipPath>
    <clipPath id="tileClip"><rect x="96" y="96" width="832" height="832" rx="187" ry="187"/></clipPath>
    <clipPath id="bodyClip"><path d="M569.83,814.70 A318,318 0 1 1 824.70,559.83 Z"/></clipPath>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="12" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.30"/>
      <feComposite in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkShadow" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C4501F" flood-opacity="0.25"/>
    </filter>
    <filter id="stickerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="flapShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- tile -->
  <g filter="url(#tileShadow)">
    <rect x="96" y="96" width="832" height="832" rx="187" ry="187" fill="url(#tileGrad)"/>
  </g>
  <g clip-path="url(#tileClip)">
    <rect x="96" y="96" width="832" height="832" fill="url(#tileGlow)"/>
    <!-- sticker drop shadow on tile -->
    <path d="M569.83,814.70 A318,318 0 1 1 824.70,559.83 Z" transform="translate(0,14)" fill="#9A3A0E" opacity="0.45" filter="url(#stickerShadow)"/>
  </g>

  <!-- tile edge: faint darker hairline all round (crisp on light backgrounds) + light top edge inside it -->
  <rect x="97" y="97" width="830" height="830" rx="186" ry="186" fill="none" stroke="#B3471A" stroke-opacity="0.14" stroke-width="2"/>
  <rect x="99" y="99" width="826" height="826" rx="184" ry="184" fill="none" stroke="url(#edgeGrad)" stroke-width="2"/>

  <!-- sticker body -->
  <path d="M569.83,814.70 A318,318 0 1 1 824.70,559.83 Z" fill="url(#borderGrad)"/>
  <g clip-path="url(#keep)">
    <circle cx="512" cy="502" r="282" fill="url(#faceGrad)"/>
    <circle cx="512" cy="502" r="282" fill="url(#faceRim)"/>
  </g>

  <!-- face features (grid-snapped, upright) -->
  <g fill="#161B2E">
    <rect x="352" y="320" width="96" height="160" rx="48"/>
    <path d="M560,448 Q624,320 688,448" fill="none" stroke="#161B2E" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M352,544 H672 C666,648 598,704 512,704 C426,704 358,648 352,544 Z"/>
  </g>
  <clipPath id="mouthClip"><path d="M352,544 H672 C666,648 598,704 512,704 C426,704 358,648 352,544 Z"/></clipPath>
  <g clip-path="url(#mouthClip)">
    <ellipse cx="500" cy="720" rx="104" ry="80" fill="#FF7A66"/>
  </g>

  <!-- flap shadow on face -->
  <g clip-path="url(#bodyClip)">
    <path d="M569.83,814.70 A318,318 0 0 1 824.70,559.83 Z" transform="translate(-9.90,-9.90)" fill="#5A2A10" opacity="0.35" filter="url(#flapShadow)"/>
  </g>
  <!-- flap (back of sticker) -->
  <path d="M569.83,814.70 A318,318 0 0 1 824.70,559.83 Z" fill="url(#flapGrad)"/>
</svg>
