<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tileGrad" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFA468"/>
      <stop offset="0.5" stop-color="#FF9A5C"/>
      <stop offset="1" stop-color="#EE6530"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="512" cy="300" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeGrad" x1="0" y1="100" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0" y1="250" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1EEF8"/>
    </linearGradient>
    <clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="185" ry="185"/></clipPath>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="12" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.30"/>
      <feComposite in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bubbleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- tile -->
  <g filter="url(#tileShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#tileGrad)"/>
  </g>
  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#tileGlow)"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" ry="184" fill="none" stroke="#B3471A" stroke-opacity="0.14" stroke-width="2"/>
  <rect x="103" y="103" width="818" height="818" rx="182" ry="182" fill="none" stroke="url(#edgeGrad)" stroke-width="2"/>

  <g transform="translate(512 470) scale(1.0) translate(-512 -470)">
    <!-- the bubble: a soft shadow on the tile, then the body and its tail -->
    <g clip-path="url(#tileClip)" opacity="0.4" filter="url(#bubbleShadow)" transform="translate(0 16)">
      <rect x="214" y="256" width="596" height="420" rx="168" fill="#9A3A0E"/>
      <path d="M296 590 C300 690 284 752 238 800 C324 796 404 756 452 664 Z" fill="#9A3A0E"/>
    </g>
    <rect x="214" y="256" width="596" height="420" rx="168" fill="url(#bubbleGrad)"/>
    <path d="M296 590 C300 690 284 752 238 800 C324 796 404 756 452 664 Z" fill="url(#bubbleGrad)"/>
    <!-- the wink: a pill eye, a closed eye, a grin -->
    <g fill="#161B2E" stroke="#161B2E" stroke-linecap="round" stroke-linejoin="round">
      <rect x="372.0" y="361.0" width="64" height="106" rx="32.0" stroke="none"/>
      <path d="M552 434 Q612 364 672 434" fill="none" stroke-width="40"/>
      <path d="M368 524 Q512 624 656 524" fill="none" stroke-width="44"/>
    </g>
  </g>
</svg>
